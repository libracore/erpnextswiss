name: ERPNextSwiss CI

on:
  push:
    branches:
      - v16
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erpnextswiss-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FRAPPE_BRANCH: version-16
  ERPNEXT_BRANCH: version-16
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  TEST_SITE: test_site

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile Python files
        run: python -m compileall erpnextswiss

      - name: Verify mutation endpoint security
        run: python scripts/verify_mutation_endpoint_security.py

  static-assets:
    name: JSON and JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          PY

      - name: Check JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find erpnextswiss -name "*.js" -type f)

      - name: Test legacy workspace routes
        run: node --test tests/test_workspace_routes.cjs

  python-distribution:
    name: Python distribution completeness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Test artifact verifier
        run: python -m unittest discover -s tests -v
      - name: Build and verify wheel and source distribution
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build
          python scripts/verify_distribution_artifacts.py --wheel dist/*.whl --sdist dist/*.tar.gz
          python -m pip install --no-deps -e .

  frappe-tests:
    name: Frappe v16 install and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis-cache:
        image: redis:8.6-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:8.6-alpine
        ports:
          - 11000:6379
      redis-socketio:
        image: redis:8.6-alpine
        ports:
          - 12000:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libmariadb-dev libsm6 libxext6 mariadb-client redis-tools rsync
          npm install -g yarn

      - name: Install Bench CLI
        run: python -m pip install frappe-bench

      - name: Create Frappe bench
        run: bench init --skip-redis-config-generation --frappe-branch "$FRAPPE_BRANCH" frappe-bench

      - name: Configure bench services
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:12000

      - name: Install ERPNext
        working-directory: frappe-bench
        run: bench get-app --branch "$ERPNEXT_BRANCH" erpnext https://github.com/frappe/erpnext

      - name: Copy ERPNextSwiss app into bench
        run: |
          mkdir -p frappe-bench/apps/erpnextswiss
          rsync -a --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "frappe-bench" \
            ./ frappe-bench/apps/erpnextswiss/

      - name: Install app requirements
        working-directory: frappe-bench
        run: |
          bench setup requirements --dev
          ./env/bin/pip install -e apps/erpnextswiss
          printf '\nerpnextswiss\n' >> sites/apps.txt
          awk 'NF && !seen[$0]++ { print }' sites/apps.txt > sites/apps.txt.tmp
          mv sites/apps.txt.tmp sites/apps.txt

      - name: Create test site without HRMS
        working-directory: frappe-bench
        run: |
          bench new-site "$TEST_SITE" \
            --admin-password admin \
            --db-root-username root \
            --db-root-password root \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --no-mariadb-socket
          bench --site "$TEST_SITE" install-app erpnext
          bench --site "$TEST_SITE" set-config allow_tests true

      - name: Verify Item maintenance against native ERPNext permissions
        working-directory: frappe-bench
        run: |
          bench --site "$TEST_SITE" run-tests --module erpnextswiss.erpnextswiss.tests.test_item_cleanup_native

      - name: Install ERPNextSwiss without HRMS
        working-directory: frappe-bench
        run: |
          bench --site "$TEST_SITE" install-app erpnextswiss

      - name: Verify native workspace route upgrade and retained history
        working-directory: frappe-bench
        run: bench --site "$TEST_SITE" run-tests --module erpnextswiss.erpnextswiss.tests.test_workspace_routes_native

      - name: Run ERPNextSwiss tests
        working-directory: frappe-bench
        run: bench --site "$TEST_SITE" run-tests --app erpnextswiss

      - name: Compare native Workspace rendering through old and direct URLs
        working-directory: frappe-bench
        run: |
          bench build --app erpnextswiss
          npm ci --ignore-scripts --prefix apps/erpnextswiss/tests/browser
          apps/erpnextswiss/tests/browser/node_modules/.bin/playwright install --with-deps chromium
          bench --site "$TEST_SITE" execute erpnextswiss.erpnextswiss.tests.test_workspace_routes_native.prepare_browser_site
          bench --site "$TEST_SITE" migrate
          bench --site "$TEST_SITE" execute erpnextswiss.erpnextswiss.tests.test_workspace_routes_native.verify_browser_site
          bench --site "$TEST_SITE" migrate
          bench --site "$TEST_SITE" execute erpnextswiss.erpnextswiss.tests.test_workspace_routes_native.verify_browser_site
          bench use "$TEST_SITE"
          bench serve --port 8000 > workspace-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/login >/dev/null; then break; fi
            sleep 1
          done
          node apps/erpnextswiss/tests/browser/workspace_routes.cjs

      - name: Preserve Workspace browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-browser-evidence
          path: |
            frappe-bench/apps/erpnextswiss/tests/browser/artifacts/
            frappe-bench/workspace-browser-server.log
          if-no-files-found: ignore
