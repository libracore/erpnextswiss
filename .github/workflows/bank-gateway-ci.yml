name: Bank gateway offline contracts

on:
  pull_request:
    paths:
      - "gateway/ebics/**"
      - "scripts/banking_readiness_inventory.py"
      - "tests/test_banking_readiness_inventory.py"
      - "erpnextswiss/scripts/bank_file_admission.py"
      - "erpnextswiss/erpnextswiss/tests/test_bank_file_admission.py"
      - "erpnextswiss/public/xsd/camt.05*.001.08.xsd"
      - ".github/workflows/bank-gateway-ci.yml"
  push:
    branches: [v16, main]
    paths:
      - "gateway/ebics/**"
      - "scripts/banking_readiness_inventory.py"
      - "tests/test_banking_readiness_inventory.py"
      - "erpnextswiss/scripts/bank_file_admission.py"
      - "erpnextswiss/erpnextswiss/tests/test_bank_file_admission.py"
      - "erpnextswiss/public/xsd/camt.05*.001.08.xsd"
      - ".github/workflows/bank-gateway-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bank-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-receipt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only inventory tests
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - name: Read-only bank archive admission against existing schemas
        run: |
          python -m pip install 'lxml==6.1.1'
          python - <<'PY'
          import resource
          import unittest
          resource.setrlimit(resource.RLIMIT_AS, (256 * 1024 ** 2, 256 * 1024 ** 2))
          suite = unittest.defaultTestLoader.loadTestsFromName('erpnextswiss.erpnextswiss.tests.test_bank_file_admission')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print('Bank archive peak RSS KiB:', resource.getrusage(resource.RUSAGE_SELF).ru_maxrss)
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Build pinned offline test image
        run: docker build --target test -t kt-bank-gateway-test gateway/ebics
      - name: Validate all gateway PHP syntax
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --memory 128m --cpus 1
          kt-bank-gateway-test sh -c 'find src tests -name "*.php" -print0 | xargs -0 -n 1 php -l'
      - name: Receipt, cryptography, restart and concurrency contracts
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --memory 256m --cpus 1.5
          kt-bank-gateway-test
      - name: Real full-disk failure without bank acknowledgement
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m
          --tmpfs /kt-disk-full:rw,noexec,nosuid,uid=10001,gid=10001,mode=0700,size=1m
          --memory 256m --cpus 1.5 -e KT_GATEWAY_DISK_FULL_TEST=1
          kt-bank-gateway-test php tests/full_disk.php
      - name: Maximum original survives the complete receipt and replay path
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --memory 512m --cpus 1.5
          -e KT_GATEWAY_SIZE_TEST=1 kt-bank-gateway-test
          php -d memory_limit=256M tests/full_size.php
      - name: Bounded HTTPS and safe XML with verified loopback TLS
        run: >-
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges
          --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --memory 256m --cpus 1.5
          -e KT_GATEWAY_HTTPS_TEST=1 kt-bank-gateway-test
          php -d memory_limit=128M tests/https_transport.php
